<article class="deal-card"><a class="deal-image" href="{{ .RelPermalink }}" style="background-image:url('{{ .Params.image | default "/images/promo-mountains.jpg" }}')" aria-label="{{ .Title }}"></a><div class="deal-body"><span class="mini-label">{{ .Params.category | default (i18n "featured_deal") }}</span><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify | truncate 110) }}</p><a class="text-link" href="{{ .RelPermalink }}" aria-label="{{ i18n "details_for" (dict "Name" .Title) }}">{{ i18n "view_deal" }} <span>→</span></a></div></article>
