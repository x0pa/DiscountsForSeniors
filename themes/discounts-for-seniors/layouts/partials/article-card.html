<article class="article-card"><a class="article-image" href="{{ .RelPermalink }}" style="background-image:url('{{ .Params.image | default "/images/article-travel.jpg" }}')" aria-label="{{ .Title }}"></a><div class="article-body"><p class="mini-label">{{ .Params.category | default (i18n "helpful_advice") }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify | truncate 120) }}</p><a class="text-link" href="{{ .RelPermalink }}">{{ i18n "read_more" }} <span>→</span></a></div></article>
